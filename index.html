<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <title>PNX Moon — Clan Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.17/index.global.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.17/index.global.min.css" rel="stylesheet" />
    <style>
      :root { --ink:#07111f; --ink-2:#0d1b2d; --panel:#102238; --panel-2:#142b45; --line:rgba(221,232,255,.13); --text:#eff5ff; --muted:#91a6c2; --gold:#d9b865; --gold-pale:#fff0bd; --moon:#a9c9ff; --violet:#b498f5; --crimson:#ef7682; --mint:#8ee3c0; --radius:18px; --ease:cubic-bezier(.23,1,.32,1); }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { margin:0; min-width:320px; color:var(--text); background:var(--ink); font-family:Manrope,system-ui,sans-serif; }
      body::before { content:""; position:fixed; inset:0; z-index:-2; background:radial-gradient(circle at 92% 12%,rgba(48,86,135,.20),transparent 25rem), radial-gradient(circle at 12% 58%,rgba(111,85,169,.11),transparent 28rem), #07111f; }
      body::after { content:""; position:fixed; inset:0; z-index:-1; opacity:.22; pointer-events:none; background-image:radial-gradient(rgba(255,255,255,.78) .55px,transparent .7px); background-size:19px 19px; mask-image:linear-gradient(to bottom,black,transparent 80%); }
      button, input { font:inherit; }
      button { color:inherit; }
      a { color:inherit; text-decoration:none; }
      .site-header { position:sticky; top:0; z-index:30; min-height:78px; display:flex; align-items:center; gap:24px; padding:12px clamp(18px,4vw,64px); border-bottom:1px solid var(--line); background:rgba(7,17,31,.86); backdrop-filter:blur(18px); }
      .brand { display:flex; align-items:center; gap:11px; min-width:max-content; }
      .brand-mark { width:42px; height:42px; display:grid; place-items:center; border:1px /*solid rgba(217,184,101,.55); border-radius:13px 13px 13px 3px; background:linear-gradient(145deg,rgba(217,184,101,.22),rgba(255,255,255,.02)); color:var(--gold-pale); font-family:"Playfair Display",serif; font-size:25px; box-shadow:inset 0 0 18px rgba(255,238,173,.08);*/ }
      .brand-mark img {display:block;width:100%;height:100%;object-fit:contain;padding:6px}
      .brand-kicker,.eyebrow { display:block; margin-bottom:2px; color:var(--gold); font:500 10px/1.2 "DM Mono",monospace; letter-spacing:.16em; text-transform:uppercase; }
      .brand-name { display:block; font:700 17px/1 "Playfair Display",serif; letter-spacing:.01em; }
      .header-divider { width:1px; align-self:stretch; min-height:30px; background:var(--line); }
      .header-live { min-width:0; display:flex; align-items:center; gap:10px; }
      .pulse { width:8px; height:8px; flex:0 0 auto; border-radius:50%; background:var(--mint); box-shadow:0 0 0 4px rgba(142,227,192,.1),0 0 12px rgba(142,227,192,.9); animation:pulse 2s infinite; }
      .readout-label { display:block; color:var(--muted); font:500 9px/1.3 "DM Mono",monospace; letter-spacing:.12em; text-transform:uppercase; }
      #active-event { display:block; overflow:hidden; max-width:310px; color:var(--gold-pale); text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
      .header-time { margin-left:auto; text-align:right; min-width:max-content; }
      #utc-time { display:block; color:#fff; font:600 12px/1.4 "DM Mono",monospace; }
      #reset-readout { color:var(--moon); font:500 10px/1.4 "DM Mono",monospace; }
      .theme-toggle { display:inline-flex; align-items:center; gap:7px; padding:9px 11px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.035); color:var(--muted); font:600 10px/1 "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; transition:color .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease); }
      .theme-toggle:hover { color:var(--gold-pale); border-color:rgba(217,184,101,.5); }
      .theme-toggle:active,.button:active,.copy-button:active { transform:scale(.97); }
      #site-body { min-height:calc(100vh - 78px); }
      .page-shell { width:min(1440px,100%); margin:0 auto; padding:34px clamp(18px,4vw,64px) 64px; animation:arrive .38s var(--ease); }
      .hero { position:relative; min-height:345px; overflow:hidden; display:flex; align-items:flex-end; padding:clamp(28px,5vw,64px); border:1px solid var(--line); border-radius:28px; background:#0b1a2b; box-shadow:0 24px 80px rgba(0,0,0,.26); }
      .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,rgba(7,17,31,.88) 0%,rgba(7,17,31,.68) 48%,rgba(7,17,31,.15) 100%),linear-gradient(0deg,rgba(7,17,31,.74) 0%,transparent 70%); }
      .hero-art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; opacity:.93; }
      .hero-content { position:relative; z-index:1; max-width:700px; }
      .hero .eyebrow { color:var(--gold-pale); }
      .hero-placeholder img{
        display: block;width: 100%;height: 100%;object-fit: contain;
      }
      h1,h2,h3,p { margin-top:0; }
      h1 { max-width:680px; margin-bottom:16px; font:600 clamp(40px,6.2vw,82px)/.96 "Playfair Display",serif; letter-spacing:-.04em; text-wrap:balance; }
      .hero-subtitle { max-width:580px; margin-bottom:25px; color:#d4e2f6; font-size:15px; line-height:1.7; }
      .hero-actions { display:flex; flex-wrap:wrap; gap:10px; }
      .button { display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 15px; border:1px solid rgba(217,184,101,.55); border-radius:9px; background:linear-gradient(135deg,rgba(217,184,101,.22),rgba(217,184,101,.06)); color:var(--gold-pale); font:700 11px/1 Manrope,sans-serif; letter-spacing:.06em; text-transform:uppercase; transition:transform .16s var(--ease),background .16s var(--ease); }
      .button:hover { background:linear-gradient(135deg,rgba(217,184,101,.34),rgba(217,184,101,.12)); transform:translateY(-1px); }
      .button.ghost { border-color:var(--line); background:rgba(7,17,31,.42); color:#e5effe; }
      .command-grid { display:grid; grid-template-columns:240px minmax(0,1fr); gap:22px; margin-top:22px; }
      .section-nav { position:sticky; top:102px; align-self:start; padding:15px; border:1px solid var(--line); border-radius:var(--radius); background:rgba(16,34,56,.58); backdrop-filter:blur(10px); }
      .section-nav-title { margin:1px 0 12px; color:var(--muted); font:500 10px/1.2 "DM Mono",monospace; letter-spacing:.13em; text-transform:uppercase; }
      .section-nav a { display:flex; align-items:center; gap:10px; padding:10px 9px; border-radius:9px; color:#c8d5e9; font-size:12px; transition:background .16s var(--ease),color .16s var(--ease),transform .16s var(--ease); }
      .section-nav a:hover { background:rgba(169,201,255,.09); color:#fff; transform:translateX(2px); }
      .nav-dot { width:5px; height:5px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px rgba(217,184,101,.8); }
      .nav-clocks { display:flex; flex-direction:column; gap:12px; margin-top:15px; padding-top:12px; border-top:1px solid var(--line); }
      .nav-clocks .r-clock { grid-template-columns:1fr; gap:7px; padding:0; border:0; background:transparent; box-shadow:none; }
      .nav-clocks .r-clock.is-active { border:0; background:transparent; }
      .nav-clocks .r-clock-label span { font-size:10px; }
      .nav-clocks .r-clock-label small { font-size:8px; }
      .nav-clocks .clock-face { width:112px; height:112px; margin:0 auto; }
      .content-stack { display:grid; gap:22px; min-width:0; }
      .section-card { scroll-margin-top:105px; padding:clamp(20px,3vw,31px); border:1px solid var(--line); border-radius:var(--radius); background:linear-gradient(145deg,rgba(19,42,69,.8),rgba(10,24,42,.82)); box-shadow:0 16px 40px rgba(0,0,0,.12); }
      .section-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:20px; }
      .section-heading h2 { margin:0; font:600 clamp(26px,3vw,36px)/1 "Playfair Display",serif; letter-spacing:-.03em; }
      .section-heading p { max-width:410px; margin:0; color:var(--muted); font-size:12px; line-height:1.6; }
      .event-tabs { display:grid; grid-template-columns:196px minmax(0,1fr); gap:0; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:rgba(4,13,25,.28); }
      .tab-list { display:flex; flex-direction:column; padding:8px; gap:5px; border-right:1px solid var(--line); background:rgba(4,13,25,.38); }
      .tab-button { display:flex; align-items:center; gap:9px; width:100%; padding:12px 10px; border:0; border-radius:9px; background:transparent; color:var(--muted); text-align:left; font:700 12px/1.2 Manrope,sans-serif; transition:background .18s var(--ease),color .18s var(--ease); }
      .tab-button:hover { background:rgba(169,201,255,.08); color:#e9f2ff; }
      .tab-button.active { background:rgba(217,184,101,.12); color:var(--gold-pale); }
      .tab-icon { display:grid; place-items:center; width:24px; height:24px; border:1px solid currentColor; border-radius:7px; font:600 15px/1 "Playfair Display",serif; }
      .tab-panel { padding:23px; min-height:244px; }
      .tab-panel-head { display:flex; justify-content:space-between; gap:15px; align-items:flex-start; margin-bottom:17px; }
      .tab-panel h3 { margin:0 0 4px; font:600 26px/1 "Playfair Display",serif; }
      .tab-cadence { padding:6px 8px; border:1px solid var(--line); border-radius:999px; color:var(--moon); font:500 9px/1 "DM Mono",monospace; white-space:nowrap; letter-spacing:.08em; text-transform:uppercase; }
      .tab-tagline { margin:0 0 15px; color:var(--gold-pale); font:italic 600 16px/1.4 "Playfair Display",serif; }
      .tab-brief { margin-bottom:18px; color:#bdcce1; font-size:13px; line-height:1.7; }
      .signal-list { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:0 0 16px; padding:0; list-style:none; }
      .signal-list li { padding:10px; border:1px solid rgba(169,201,255,.11); border-radius:8px; background:rgba(169,201,255,.035); color:#d5e0ee; font-size:11px; line-height:1.45; }
      .guide-callout { padding:9px 11px; border-left:2px solid var(--gold); background:rgba(217,184,101,.07); color:#c9d7ea; font-size:11px; }
      .guide-panel-shell { position:relative; overflow:hidden; min-height:300px; border-radius:12px; background:rgba(4,13,25,.28); }
      .guide-panel-shell::before { content:""; position:absolute; inset:0; background-image:var(--guide-bg); background-size:cover; background-position:center; opacity:.2; filter:saturate(.85); }
      .guide-panel-content { position:relative; z-index:1; padding:22px; background:linear-gradient(90deg,rgba(4,13,25,.94),rgba(4,13,25,.72) 60%,rgba(4,13,25,.45)); }
      .guide-date { display:block; margin-top:6px; color:var(--muted); font:500 10px/1 "DM Mono",monospace; }
      .guide-sections { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:18px; }
      .guide-detail { padding:13px; border:1px solid rgba(169,201,255,.13); border-radius:10px; background:rgba(4,13,25,.34); }
      .guide-detail h4 { margin:0 0 9px; color:var(--gold-pale); font:600 11px/1 "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; }
      .bonus-list,.window-list { display:flex; flex-wrap:wrap; gap:6px; margin:0; padding:0; list-style:none; }
      .bonus-list li,.window-list li { padding:6px 8px; border:1px solid rgba(169,201,255,.16); border-radius:999px; color:var(--text); font-size:10px; }
      .window-list li { color:var(--crimson); border-color:rgba(239,82,96,.35); font:600 11px "DM Mono",monospace; }
      .guide-defence { grid-column:1/-1; border-left:2px solid var(--crimson); color:#f0c8ce; font-size:11px; line-height:1.5; }
      .guide-trials { margin-top:18px; }
      .current-stage-note { display:block; margin:-4px 0 10px; color:var(--mint); font:500 9px/1 "DM Mono",monospace; letter-spacing:.05em; text-transform:uppercase; }
      .trial-buttons { display:flex; flex-wrap:wrap; gap:7px; }
      .trial-button,.monster-choice { padding:7px 9px; border:1px solid rgba(169,201,255,.18); border-radius:7px; background:rgba(169,201,255,.05); color:var(--muted); font:600 10px/1 "DM Mono",monospace; cursor:pointer; }
      .trial-button:hover,.trial-button.active,.monster-choice:hover,.monster-choice.active { border-color:var(--gold); color:var(--gold-pale); background:rgba(217,184,101,.12); }
      .trial-button.is-current { box-shadow:0 0 0 2px rgba(142,227,192,.18); }
      .monster-choice { margin-right:6px; }
      .epic-button { display:inline-flex; align-items:center; gap:7px; margin-top:13px; padding:9px 11px; border:1px solid rgba(239,82,96,.45); border-radius:7px; background:rgba(239,82,96,.09); color:#ffd7dc; font:600 10px/1 "DM Mono",monospace; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; }
      .window-list li.dark-omens-timing-cue { color:#ff6b78; text-shadow:0 0 10px rgba(239,82,96,.28); font-weight:700; }
      .points-table { width:100%; border-collapse:collapse; color:var(--muted); font-size:10px; }
      .points-table th,.points-table td { padding:7px 5px; border-bottom:1px solid rgba(169,201,255,.11); text-align:left; }
      .points-table th { color:var(--gold-pale); font:600 9px "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; }
      .points-table td:last-child { color:var(--text); font:600 11px "DM Mono",monospace; text-align:right; }
      .troop-categories { display:grid; gap:12px; }
      .troop-category { overflow:hidden; border:1px solid var(--line); border-radius:14px; background:rgba(9,20,35,.34); }
      .troop-category > summary { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; cursor:pointer; list-style:none; }
      .troop-category > summary::-webkit-details-marker { display:none; }
      .troop-category > summary::after { content:"＋"; color:var(--gold-pale); font-size:18px; }
      .troop-category[open] > summary::after { content:"−"; }
      .troop-category-title strong,.troop-category-title span { display:block; }
      .troop-category-title strong { color:var(--text); font:600 16px/1.2 "Playfair Display",serif; }
      .troop-category-title span { margin-top:5px; color:var(--muted); font-size:11px; line-height:1.45; }
      .troop-calculator { padding:0 18px 18px; }
      .troop-selectors { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; padding:14px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.025); }
      .troop-selector { display:grid; gap:6px; }
      .troop-selector label { color:var(--muted); font:600 10px/1 "DM Mono",monospace; letter-spacing:.12em; text-transform:uppercase; }
      .troop-selector select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel-2); color:var(--text); font:600 12px "DM Mono",monospace; }
      .troop-selector select:disabled { opacity:.38; cursor:not-allowed; }
      .troop-result-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:16px 0 10px; }
      .troop-result-head strong { color:var(--gold-pale); font:600 15px/1.2 "Playfair Display",serif; }
      .troop-code { color:var(--muted); font:11px "DM Mono",monospace; }
      .troop-units { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
      .troop-unit { display:grid; grid-template-columns:48px 1fr; gap:10px; align-items:center; padding:10px; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.025); }
      .troop-unit img { width:48px; height:38px; object-fit:cover; border-radius:7px; }
      .troop-unit strong,.troop-unit span { display:block; }
      .troop-unit strong { color:var(--text); font-size:12px; }
      .troop-unit span { margin-top:3px; color:var(--muted); font-size:10px; line-height:1.35; }
      .troop-unit .troop-count { color:var(--gold-pale); font:700 12px "DM Mono",monospace; }
      .troop-notes { margin-top:12px; color:var(--muted); font-size:10px; line-height:1.5; }
      .calendar-layout { display:box; grid-template-columns:minmax(0,1fr) 230px; gap:17px; align-items:start; }
      .fc-event-time {display: none;}
      .calendar-frame { min-width:0; padding:12px; border:1px solid var(--line); border-radius:14px; background:#091a2d; }
      .calendar-note { padding:17px; border:1px solid rgba(217,184,101,.22); border-radius:14px; background:linear-gradient(145deg,rgba(217,184,101,.12),rgba(217,184,101,.03)); }
      .calendar-note h3 { margin:5px 0 10px; color:var(--gold-pale); font:600 21px/1.1 "Playfair Display",serif; }
      .calendar-note p { margin-bottom:13px; color:#c6d5e8; font-size:11px; line-height:1.65; }
      .r-clock-note { display:flex; flex-direction:column; gap:13px; }
      .clock-note-heading p { margin-bottom:0; }
      .r-clocks { display:flex; flex-direction:column; gap:12px; }
      .r-clock { display:grid; grid-template-columns:1fr 108px; align-items:center; gap:10px; padding:10px; border:1px solid rgba(217,184,101,.16); border-radius:12px; background:rgba(7,17,31,.22); transition:border-color .2s var(--ease),background .2s var(--ease),opacity .2s var(--ease); }
      .r-clock.is-active { border-color:rgba(217,184,101,.62); background:rgba(217,184,101,.1); }
      .r-clock-label span { display:block; color:var(--gold-pale); font:600 11px/1.25 "DM Mono",monospace; }
      .r-clock-label small { display:block; margin-top:4px; color:var(--muted); font:500 9px/1.3 "DM Mono",monospace; }
      .clock-face { position:relative; width:94px; height:94px; margin-left:auto; border:1px solid rgba(217,184,101,.48); border-radius:50%; background:radial-gradient(circle at 50% 45%,rgba(217,184,101,.12),rgba(7,17,31,.72) 68%); box-shadow:inset 0 0 0 5px rgba(217,184,101,.045),0 0 18px rgba(217,184,101,.08); }
      .clock-face::before { content:""; position:absolute; inset:7px; border:1px dashed rgba(217,184,101,.2); border-radius:50%; }
      .clock-label { position:absolute; transform:translate(-50%,-50%); color:#f8e8b2; font:600 8px/1 "DM Mono",monospace; white-space:nowrap; transition:color .2s var(--ease),text-shadow .2s var(--ease); }
      .clock-label.reminder { color:#ff6b73; text-shadow:0 0 7px rgba(255,83,96,.9); }
      .clock-hand { position:absolute; left:50%; bottom:50%; z-index:2; width:2px; transform-origin:50% 100%; border-radius:2px; background:var(--gold-pale); box-shadow:0 0 6px rgba(255,240,189,.55); transition:transform .35s linear; }
      .hour-hand { height:27px; }
      .minute-hand { z-index:1; width:1px; height:35px; background:var(--moon); opacity:.8; }
      .clock-center { position:absolute; left:50%; top:50%; z-index:3; width:7px; height:7px; transform:translate(-50%,-50%); border:1px solid var(--gold-pale); border-radius:50%; background:var(--gold); box-shadow:0 0 7px var(--gold); }
      .coming-soon-panel { display:flex; align-items:center; gap:14px; min-height:130px; padding:22px; border:1px dashed rgba(217,184,101,.3); border-radius:14px; background:linear-gradient(135deg,rgba(217,184,101,.08),rgba(255,255,255,.02)); }
      .coming-soon-mark { display:grid; place-items:center; width:48px; height:48px; border:1px solid rgba(217,184,101,.4); border-radius:50%; color:var(--gold-pale); font-size:25px; }
      .coming-soon-panel strong,.coming-soon-panel span { display:block; }
      .coming-soon-panel strong { color:var(--gold-pale); font:600 16px/1.2 "Playfair Display",serif; }
      .coming-soon-panel span:not(.coming-soon-mark) { margin-top:5px; color:var(--muted); font-size:11px; line-height:1.5; }
      .key { display:grid; gap:8px; }
      .key-item { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:10px; }
      .key-swatch { width:9px; height:9px; border-radius:50%; background:var(--gold); box-shadow:0 0 9px currentColor; }
      .key-swatch.violet { background:var(--violet); color:var(--violet); }.key-swatch.crimson { background:var(--crimson); color:var(--crimson); }.key-swatch.silver { background:var(--moon); color:var(--moon); }
      .checklist-layout { display:grid; grid-template-columns:minmax(0,1fr) 240px; gap:18px; }
      .checklist { display:grid; gap:7px; }
      .check-row { position:relative; display:grid; grid-template-columns:20px 1fr auto; align-items:center; gap:11px; min-height:54px; padding:10px 13px; border:1px solid rgba(169,201,255,.11); border-radius:10px; background:rgba(4,13,25,.21); cursor:pointer; transition:border-color .18s var(--ease),background .18s var(--ease); }
      .check-row:hover { border-color:rgba(169,201,255,.3); background:rgba(169,201,255,.045); }
      .check-row input { appearance:none; width:17px; height:17px; margin:0; border:1px solid rgba(169,201,255,.48); border-radius:5px; background:#0c1d31; transition:background .16s var(--ease),border-color .16s var(--ease); }
      .check-row input:checked { border-color:var(--mint); background:var(--mint); box-shadow:inset 0 0 0 3px #0c1d31; }

              return `<div class="troop-family-result"><div class="troop-result-head"><strong>${escapeHtml(entry.label || key)}</strong><span class="troop-code">${escapeHtml(key)}</span></div><div class="troop-units">${(entry.units || []).map(unit => `<article class="troop-unit"><img src="${escapeHtml(unit.image || './data/troops/images/monster.svg')}" alt="${escapeHtml(unit.name)}"><div><strong>${escapeHtml(unit.name)}</strong><span>${escapeHtml((unit.aliases || []).join(' · '))}</span><span class="troop-count">${Number(unit.count || 0).toLocaleString()} troops</span></div></article>`).join('')}</div><p class="troop-notes">${escapeHtml(entry.notes || '')}</p></div>`;
            });
            if (includeEngineering) {
              const key = `E${values.E}`;
              const entry = (families.engineering || {})[key];
              blocks.push(entry
                ? `<div class="troop-family-result"><div class="troop-result-head"><strong>${escapeHtml(entry.label || key)}</strong><span class="troop-code">${escapeHtml(key)}</span></div><div class="troop-units">${(entry.units || []).map(unit => `<article class="troop-unit"><img src="${escapeHtml(unit.image || './data/troops/images/engineering.svg')}" alt="${escapeHtml(unit.name)}"><div><strong>${escapeHtml(unit.name)}</strong><span>${escapeHtml((unit.aliases || []).join(' · '))}</span><span class="troop-count">${Number(unit.count || 0).toLocaleString()} troops</span></div></article>`).join('')}</div><p class="troop-notes">${escapeHtml(entry.notes || '')}</p></div>`
                : `<p class="troop-notes">No Engineering Corps data is available for ${escapeHtml(key)} yet.</p>`);
            } else if (category.engineering) {
              blocks.push('<p class="troop-notes">Engineering Corps data has not been added yet.</p>');
            }
            const result = card.querySelector('[data-troop-result]');
            result.innerHTML = `<div class="troop-result-head"><strong>${category.pvp ? 'Estimated enemy composition' : 'Selected composition'}</strong><span class="troop-code">${escapeHtml(code)}</span></div>${blocks.join('')}`;
          };
          card.querySelectorAll('[data-troop-selector]').forEach(select => select.addEventListener('change', update));
          update();
        });
      }
      function startCalendar() {
        const element = document.getElementById('event-calendar'); if (!element || !window.FullCalendar) return;
        if (appState.calendar) appState.calendar.destroy();
        appState.calendar = new FullCalendar.Calendar(element, { initialView:'dayGridMonth', firstDay:1, height:'auto', fixedWeekCount:false, dayMaxEvents:false, headerToolbar:{ left:'prev,next today', center:'title', right:'' }, buttonText:{ today:'now' }, eventSources:[{ url:'./data/tb-events.ics', format:'ics' }], eventClassNames: arg => { const title = arg.event.title.toLowerCase(); if (title.includes('ragnar')) return ['ragnarok']; if (title.includes('dark omens')) return ['dark-omens']; if (title.includes('tinman')) return ['tinman']; return []; } });
        appState.calendar.render();
      }
      async function initMoon() {
        const [guides, checklist, categories, guardsmen, specialists, monsters, eventBonuses, darkOmensPoints, olympusPoints, ragnarokPoints] = await Promise.all([
          fetchJson('./data/event-guides.json', fallbackGuides),
          fetchJson('./data/daily-checklist.json', fallbackChecklist),
          fetchJson('./data/troops/troop-categories.json', []),
          fetchJson('./data/troops/guardsmen.json', {}),
          fetchJson('./data/troops/specialists.json', {}),
          fetchJson('./data/troops/monsters.json', {}),
          fetchJson('./data/event-bonuses.json', {}),
          fetchJson('./data/dark-omens-points.json', {}),
          fetchJson('./data/olympus-points.json', {}),
          fetchJson('./data/ragnarok-points.json', {})
        ]);
        appState.checklistItems = checklist;
        appState.eventBonuses = eventBonuses;
        appState.darkOmensPoints = darkOmensPoints;
        appState.olympusPoints = olympusPoints;
        appState.ragnarokPoints = ragnarokPoints;
        renderGuides(guides);
        renderChecklist(checklist, appState.calendarEvents);
        renderTroopCalculator(categories, { guardsmen, specialists, monsters, engineering:{} });
        startCalendar();
      }
      async function loadTheme(mode) {
        appState.mode = mode; const target = document.getElementById('site-body'); target.innerHTML = '<div class="empty-state">Opening the command ledger…</div>';
        try { const response = await fetch(`./${mode}.html`); if (!response.ok) throw new Error('view unavailable'); const html = await response.text(); const source = new DOMParser().parseFromString(html,'text/html'); target.innerHTML = source.body.innerHTML; document.title = source.title || 'Moonwatch — Clan Command'; document.body.dataset.mode = mode; const meta = themeMeta[mode] || themeMeta.moon; document.title = meta.title; const brandMark = document.getElementById('brand-mark'); const brandName = document.getElementById('brand-name'); if (!brandMark) { brandMark.innerHTML='<img src="${meta.logo}" alt="PNX"'; brandMark.className = 'brand-mark' + (mode === 'moon' ? ' brand-mark' : ''); } if (brandName) { brandName.textContent = meta.name; brandName.className = 'brand-name' + (mode === 'royal' ? ' royal-word' : ''); } document.querySelector('.brand-kicker')?.classList.toggle('royal-kicker', mode === 'royal'); document.querySelector('.hero')?.classList.toggle('royal-hero', mode === 'royal'); document.querySelectorAll('.section-card').forEach(card => card.classList.toggle('royal-card', mode === 'royal')); document.querySelector('.section-nav')?.classList.toggle('royal-nav', mode === 'royal');
         //document.querySelector('.theme-picker')?.classList.toggle('royal-theme', mode === 'royal');
         if (mode === 'moon' || mode === 'sun' || mode === 'royal') await initMoon(); } catch { target.innerHTML = '<div class="empty-state">The requested command view could not be opened.</div>'; }
        updateThemeControl();
      }
      function updateThemeControl() { const select = document.querySelector('[data-theme-select]'); if (select) select.value = appState.mode; }
      document.addEventListener('change', event => { const select = event.target.closest('[data-theme-select]'); if (select) loadTheme(select.value); });
      document.addEventListener('click', event => { const ragnarokMonster = event.target.closest('[data-ragnarok-monster]'); const stageButton = event.target.closest('[data-olympus-stage]'); const scrollTarget = event.target.closest('[data-scroll-target]'); const loader = event.target.closest('[data-load-theme]'); const copy = event.target.closest('[data-copy]'); if (ragnarokMonster) updateRagnarokMonster(ragnarokMonster.dataset.ragnarokMonster); if (stageButton) updateOlympusStage(stageButton.dataset.olympusStage); if (scrollTarget) { event.preventDefault(); document.getElementById(scrollTarget.dataset.scrollTarget)?.scrollIntoView({behavior:'smooth',block:'start'}); } if (loader) { event.preventDefault(); loadTheme(loader.dataset.loadTheme); } if (copy && navigator.clipboard) { navigator.clipboard.writeText(copy.dataset.copy).then(() => { const original = copy.textContent; copy.textContent = 'Copied'; setTimeout(() => copy.textContent = original, 1100); }); } });
      updateClock(); setInterval(updateClock,1000); hydrateActiveEvent();
      const requestedMode = new URLSearchParams(location.search).get('view'); const initialMode = ['moon','sun','royal'].includes(requestedMode) ? requestedMode : 'moon'; loadTheme(initialMode);
    </script>
  </body>
</html>

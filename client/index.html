<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <title>Moonwatch — Clan Command</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.17/index.global.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.17/index.global.min.css" rel="stylesheet" />
    <style>
      :root { --ink:#07111f; --ink-2:#0d1b2d; --panel:#102238; --panel-2:#142b45; --line:rgba(221,232,255,.13); --text:#eff5ff; --muted:#91a6c2; --gold:#d9b865; --gold-pale:#fff0bd; --moon:#a9c9ff; --violet:#b498f5; --crimson:#ef7682; --mint:#8ee3c0; --radius:18px; --ease:cubic-bezier(.23,1,.32,1); }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { margin:0; min-width:320px; color:var(--text); background:var(--ink); font-family:Manrope,system-ui,sans-serif; }
      body::before { content:""; position:fixed; inset:0; z-index:-2; background:radial-gradient(circle at 92% 12%,rgba(48,86,135,.20),transparent 25rem), radial-gradient(circle at 12% 58%,rgba(111,85,169,.11),transparent 28rem), #07111f; }
      body::after { content:""; position:fixed; inset:0; z-index:-1; opacity:.22; pointer-events:none; background-image:radial-gradient(rgba(255,255,255,.78) .55px,transparent .7px); background-size:19px 19px; mask-image:linear-gradient(to bottom,black,transparent 80%); }
      button, input { font:inherit; }
      button { color:inherit; }
      a { color:inherit; text-decoration:none; }
      .site-header { position:sticky; top:0; z-index:30; min-height:78px; display:flex; align-items:center; gap:24px; padding:12px clamp(18px,4vw,64px); border-bottom:1px solid var(--line); background:rgba(7,17,31,.86); backdrop-filter:blur(18px); }
      .brand { display:flex; align-items:center; gap:11px; min-width:max-content; }
      .brand-mark { width:42px; height:42px; display:grid; place-items:center; border:1px solid rgba(217,184,101,.55); border-radius:13px 13px 13px 3px; background:linear-gradient(145deg,rgba(217,184,101,.22),rgba(255,255,255,.02)); color:var(--gold-pale); font-family:"Playfair Display",serif; font-size:25px; box-shadow:inset 0 0 18px rgba(255,238,173,.08); }
      .brand-kicker,.eyebrow { display:block; margin-bottom:2px; color:var(--gold); font:500 10px/1.2 "DM Mono",monospace; letter-spacing:.16em; text-transform:uppercase; }
      .brand-name { display:block; font:700 17px/1 "Playfair Display",serif; letter-spacing:.01em; }
      .header-divider { width:1px; align-self:stretch; min-height:30px; background:var(--line); }
      .header-live { min-width:0; display:flex; align-items:center; gap:10px; }
      .pulse { width:8px; height:8px; flex:0 0 auto; border-radius:50%; background:var(--mint); box-shadow:0 0 0 4px rgba(142,227,192,.1),0 0 12px rgba(142,227,192,.9); animation:pulse 2s infinite; }
      .readout-label { display:block; color:var(--muted); font:500 9px/1.3 "DM Mono",monospace; letter-spacing:.12em; text-transform:uppercase; }
      #active-event { display:block; overflow:hidden; max-width:310px; color:var(--gold-pale); text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
      .header-time { margin-left:auto; text-align:right; min-width:max-content; }
      #utc-time { display:block; color:#fff; font:600 12px/1.4 "DM Mono",monospace; }
      #reset-readout { color:var(--moon); font:500 10px/1.4 "DM Mono",monospace; }
      .theme-toggle { display:inline-flex; align-items:center; gap:7px; padding:9px 11px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.035); color:var(--muted); font:600 10px/1 "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; transition:color .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease); }
      .theme-toggle:hover { color:var(--gold-pale); border-color:rgba(217,184,101,.5); }
      .theme-toggle:active,.button:active,.copy-button:active { transform:scale(.97); }
      #site-body { min-height:calc(100vh - 78px); }
      .page-shell { width:min(1440px,100%); margin:0 auto; padding:34px clamp(18px,4vw,64px) 64px; animation:arrive .38s var(--ease); }
      .hero { position:relative; min-height:345px; overflow:hidden; display:flex; align-items:flex-end; padding:clamp(28px,5vw,64px); border:1px solid var(--line); border-radius:28px; background:#0b1a2b; box-shadow:0 24px 80px rgba(0,0,0,.26); }
      .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,rgba(7,17,31,.88) 0%,rgba(7,17,31,.68) 48%,rgba(7,17,31,.15) 100%),linear-gradient(0deg,rgba(7,17,31,.74) 0%,transparent 58%); }
      .hero-art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; opacity:.93; }
      .hero-content { position:relative; z-index:1; max-width:700px; }
      .hero .eyebrow { color:var(--gold-pale); }
      h1,h2,h3,p { margin-top:0; }
      h1 { max-width:680px; margin-bottom:16px; font:600 clamp(40px,6.2vw,82px)/.96 "Playfair Display",serif; letter-spacing:-.04em; text-wrap:balance; }
      .hero-subtitle { max-width:580px; margin-bottom:25px; color:#d4e2f6; font-size:15px; line-height:1.7; }
      .hero-actions { display:flex; flex-wrap:wrap; gap:10px; }
      .button { display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 15px; border:1px solid rgba(217,184,101,.55); border-radius:9px; background:linear-gradient(135deg,rgba(217,184,101,.22),rgba(217,184,101,.06)); color:var(--gold-pale); font:700 11px/1 Manrope,sans-serif; letter-spacing:.06em; text-transform:uppercase; transition:transform .16s var(--ease),background .16s var(--ease); }
      .button:hover { background:linear-gradient(135deg,rgba(217,184,101,.34),rgba(217,184,101,.12)); transform:translateY(-1px); }
      .button.ghost { border-color:var(--line); background:rgba(7,17,31,.42); color:#e5effe; }
      .command-grid { display:grid; grid-template-columns:240px minmax(0,1fr); gap:22px; margin-top:22px; }
      .section-nav { position:sticky; top:102px; align-self:start; padding:15px; border:1px solid var(--line); border-radius:var(--radius); background:rgba(16,34,56,.58); backdrop-filter:blur(10px); }
      .section-nav-title { margin:1px 0 12px; color:var(--muted); font:500 10px/1.2 "DM Mono",monospace; letter-spacing:.13em; text-transform:uppercase; }
      .section-nav a { display:flex; align-items:center; gap:10px; padding:10px 9px; border-radius:9px; color:#c8d5e9; font-size:12px; transition:background .16s var(--ease),color .16s var(--ease),transform .16s var(--ease); }
      .section-nav a:hover { background:rgba(169,201,255,.09); color:#fff; transform:translateX(2px); }
      .nav-dot { width:5px; height:5px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px rgba(217,184,101,.8); }
      .content-stack { display:grid; gap:22px; min-width:0; }
      .section-card { scroll-margin-top:105px; padding:clamp(20px,3vw,31px); border:1px solid var(--line); border-radius:var(--radius); background:linear-gradient(145deg,rgba(19,42,69,.8),rgba(10,24,42,.82)); box-shadow:0 16px 40px rgba(0,0,0,.12); }
      .section-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:20px; }
      .section-heading h2 { margin:0; font:600 clamp(26px,3vw,36px)/1 "Playfair Display",serif; letter-spacing:-.03em; }
      .section-heading p { max-width:410px; margin:0; color:var(--muted); font-size:12px; line-height:1.6; }
      .event-tabs { display:grid; grid-template-columns:196px minmax(0,1fr); gap:0; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:rgba(4,13,25,.28); }
      .tab-list { display:flex; flex-direction:column; padding:8px; gap:5px; border-right:1px solid var(--line); background:rgba(4,13,25,.38); }
      .tab-button { display:flex; align-items:center; gap:9px; width:100%; padding:12px 10px; border:0; border-radius:9px; background:transparent; color:var(--muted); text-align:left; font:700 12px/1.2 Manrope,sans-serif; transition:background .18s var(--ease),color .18s var(--ease); }
      .tab-button:hover { background:rgba(169,201,255,.08); color:#e9f2ff; }
      .tab-button.active { background:rgba(217,184,101,.12); color:var(--gold-pale); }
      .tab-icon { display:grid; place-items:center; width:24px; height:24px; border:1px solid currentColor; border-radius:7px; font:600 15px/1 "Playfair Display",serif; }
      .tab-panel { padding:23px; min-height:244px; }
      .tab-panel-head { display:flex; justify-content:space-between; gap:15px; align-items:flex-start; margin-bottom:17px; }
      .tab-panel h3 { margin:0 0 4px; font:600 26px/1 "Playfair Display",serif; }
      .tab-cadence { padding:6px 8px; border:1px solid var(--line); border-radius:999px; color:var(--moon); font:500 9px/1 "DM Mono",monospace; white-space:nowrap; letter-spacing:.08em; text-transform:uppercase; }
      .tab-tagline { margin:0 0 15px; color:var(--gold-pale); font:italic 600 16px/1.4 "Playfair Display",serif; }
      .tab-brief { margin-bottom:18px; color:#bdcce1; font-size:13px; line-height:1.7; }
      .signal-list { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:0 0 16px; padding:0; list-style:none; }
      .signal-list li { padding:10px; border:1px solid rgba(169,201,255,.11); border-radius:8px; background:rgba(169,201,255,.035); color:#d5e0ee; font-size:11px; line-height:1.45; }
      .signal-list li::before { content:"↳"; display:block; margin-bottom:4px; color:var(--gold); }
      .guide-callout { padding:9px 11px; border-left:2px solid var(--gold); background:rgba(217,184,101,.07); color:#c9d7ea; font-size:11px; }
      .calendar-layout { display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:17px; align-items:start; }
      .calendar-frame { min-width:0; padding:12px; border:1px solid var(--line); border-radius:14px; background:#091a2d; }
      .calendar-note { padding:17px; border:1px solid rgba(217,184,101,.22); border-radius:14px; background:linear-gradient(145deg,rgba(217,184,101,.12),rgba(217,184,101,.03)); }
      .calendar-note h3 { margin:5px 0 10px; color:var(--gold-pale); font:600 21px/1.1 "Playfair Display",serif; }
      .calendar-note p { margin-bottom:13px; color:#c6d5e8; font-size:11px; line-height:1.65; }
      .key { display:grid; gap:8px; }
      .key-item { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:10px; }
      .key-swatch { width:9px; height:9px; border-radius:50%; background:var(--gold); box-shadow:0 0 9px currentColor; }
      .key-swatch.violet { background:var(--violet); color:var(--violet); }.key-swatch.crimson { background:var(--crimson); color:var(--crimson); }.key-swatch.silver { background:var(--moon); color:var(--moon); }
      .checklist-layout { display:grid; grid-template-columns:minmax(0,1fr) 240px; gap:18px; }
      .checklist { display:grid; gap:7px; }
      .check-row { position:relative; display:grid; grid-template-columns:20px 1fr auto; align-items:center; gap:11px; min-height:54px; padding:10px 13px; border:1px solid rgba(169,201,255,.11); border-radius:10px; background:rgba(4,13,25,.21); cursor:pointer; transition:border-color .18s var(--ease),background .18s var(--ease); }
      .check-row:hover { border-color:rgba(169,201,255,.3); background:rgba(169,201,255,.045); }
      .check-row input { appearance:none; width:17px; height:17px; margin:0; border:1px solid rgba(169,201,255,.48); border-radius:5px; background:#0c1d31; transition:background .16s var(--ease),border-color .16s var(--ease); }
      .check-row input:checked { border-color:var(--mint); background:var(--mint); box-shadow:inset 0 0 0 3px #0c1d31; }
      .check-copy strong { display:block; margin-bottom:3px; color:#e9f1fc; font-size:12px; }
      .check-copy span { display:block; color:var(--muted); font-size:10px; line-height:1.35; }
      .check-row input:checked ~ .check-copy strong { color:var(--mint); text-decoration:line-through; text-decoration-thickness:1px; }
      .check-status { color:var(--muted); font:500 9px/1 "DM Mono",monospace; text-transform:uppercase; }
      .check-row input:checked ~ .check-status { color:var(--mint); }
      .check-summary { display:flex; flex-direction:column; justify-content:center; min-height:190px; padding:22px; border:1px solid rgba(142,227,192,.23); border-radius:14px; background:linear-gradient(145deg,rgba(142,227,192,.09),rgba(4,13,25,.18)); }
      .summary-number { margin:3px 0 3px; color:#f3fff9; font:600 56px/.9 "Playfair Display",serif; }
      .summary-number small { color:var(--mint); font:500 19px/1 "DM Mono",monospace; }
      .summary-copy { margin:0; color:var(--muted); font-size:11px; line-height:1.55; }
      .progress-line { height:5px; margin-top:18px; overflow:hidden; border-radius:99px; background:rgba(142,227,192,.15); }
      .progress-line span { display:block; height:100%; width:0; border-radius:inherit; background:var(--mint); box-shadow:0 0 12px rgba(142,227,192,.7); transition:width .28s var(--ease); }
      .troop-library { display:grid; gap:8px; }
      .troop-family { overflow:hidden; border:1px solid rgba(169,201,255,.12); border-radius:11px; background:rgba(4,13,25,.20); }
      .troop-family > summary,.tier-expander > summary { list-style:none; cursor:pointer; } .troop-family > summary::-webkit-details-marker,.tier-expander > summary::-webkit-details-marker { display:none; }
      .troop-family > summary { display:flex; align-items:center; gap:12px; padding:14px 15px; }
      .troop-family > summary::after { content:"+"; margin-left:auto; color:var(--gold); font:300 24px/1 "DM Mono",monospace; transition:transform .18s var(--ease); }.troop-family[open] > summary::after { transform:rotate(45deg); }
      .troop-mark { display:grid; place-items:center; width:30px; height:30px; border:1px solid rgba(217,184,101,.5); border-radius:8px; color:var(--gold-pale); font:600 16px/1 "Playfair Display",serif; }
      .troop-family strong { display:block; margin-bottom:3px; color:#ebf3ff; font-size:13px; }.troop-family .troop-note { color:var(--muted); font-size:10px; }
      .tier-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; padding:0 14px 14px 56px; }
      .tier-expander { border:1px solid rgba(169,201,255,.1); border-radius:8px; background:rgba(169,201,255,.035); }.tier-expander > summary { display:flex; justify-content:space-between; gap:8px; padding:10px; color:#dfeafb; font:600 11px/1 "DM Mono",monospace; }.tier-expander > summary span:last-child { color:var(--gold); }.tier-content { padding:0 10px 10px; color:var(--muted); font-size:10px; line-height:1.5; }.tier-code { display:inline-block; margin-bottom:6px; color:var(--gold-pale); font:500 10px/1 "DM Mono",monospace; }
      .copy-button { display:inline-flex; margin-top:8px; padding:5px 6px; border:1px solid rgba(169,201,255,.18); border-radius:5px; background:transparent; color:var(--moon); font:500 8px/1 "DM Mono",monospace; letter-spacing:.06em; text-transform:uppercase; }
      .copy-button:hover { border-color:rgba(169,201,255,.45); }
      .sun-standby { display:grid; place-items:center; min-height:65vh; text-align:center; }.sun-orb { width:100px; height:100px; margin:0 auto 20px; border:1px solid rgba(255,223,128,.65); border-radius:50%; background:radial-gradient(circle at 35% 35%,#fff8cc,#dbad50 55%,#704a1a 100%); box-shadow:0 0 80px rgba(236,185,85,.35); }.sun-standby h1 { font-size:50px; }.sun-standby p { max-width:450px; margin:0 auto 18px; color:var(--muted); line-height:1.7; }
      body[data-mode="sun"] { --ink:#f7f3e9; --ink-2:#fffdf7; --panel:#fffdf7; --panel-2:#f3ead7; --line:rgba(57,65,74,.16); --text:#25313c; --muted:#6f7a83; --gold:#af7c25; --gold-pale:#70480c; --moon:#2f6e93; --violet:#765eb1; --crimson:#be4d5c; --mint:#2c8a70; background:#f7f3e9; color:var(--text); }
      body[data-mode="sun"]::before { background:radial-gradient(circle at 88% 10%,rgba(250,207,106,.27),transparent 23rem), radial-gradient(circle at 8% 55%,rgba(171,214,229,.28),transparent 28rem), #f7f3e9; }
      body[data-mode="sun"]::after { opacity:.13; background-image:radial-gradient(rgba(88,68,35,.6) .5px,transparent .7px); }
      body[data-mode="sun"] .site-header { background:rgba(255,253,247,.88); box-shadow:0 8px 24px rgba(93,75,38,.08); }
      body[data-mode="sun"] .brand-mark { background:linear-gradient(145deg,rgba(217,184,101,.35),rgba(255,255,255,.38)); color:var(--gold-pale); }
      body[data-mode="sun"] .brand-name, body[data-mode="sun"] h1, body[data-mode="sun"] h2, body[data-mode="sun"] h3 { color:#283744; }
      body[data-mode="sun"] .section-card, body[data-mode="sun"] .day-card { background:rgba(255,253,247,.8); box-shadow:0 18px 44px rgba(88,68,35,.08); }
      body[data-mode="sun"] .section-nav, body[data-mode="sun"] .calendar-frame, body[data-mode="sun"] .check-row, body[data-mode="sun"] .troop-family { background:rgba(255,255,255,.52); }
      body[data-mode="sun"] .hero { display:none; }
      .sun-hero { position:relative; min-height:390px; overflow:hidden; display:flex; align-items:center; padding:clamp(28px,5vw,64px); border:1px solid rgba(175,124,37,.22); border-radius:28px; background:linear-gradient(115deg,#fffdf7 0%,#f9efd4 58%,#e8d09b 100%); box-shadow:0 24px 80px rgba(116,91,42,.12); }

      async function hydrateActiveEvent() { try { const response = await fetch('/data/tb-events.ics'); if (!response.ok) throw new Error('calendar unavailable'); renderActiveEvent(parseIcs(await response.text())); } catch { const live = document.getElementById('active-event'); if (live) live.textContent = 'Calendar unavailable'; } }
      function renderGuides(guides) {
        const target = document.getElementById('event-guides'); if (!target) return;
        target.innerHTML = `<div class="event-tabs"><div class="tab-list" role="tablist" aria-label="Major event briefings">${guides.map((guide,index) => `<button class="tab-button ${index === 0 ? 'active' : ''}" type="button" role="tab" aria-selected="${index === 0}" data-guide="${escapeHtml(guide.id)}"><span class="tab-icon">${escapeHtml(guide.icon)}</span>${escapeHtml(guide.name)}</button>`).join('')}</div><div class="tab-panel" id="guide-panel"></div></div>`;
        const panel = document.getElementById('guide-panel');
        const openGuide = id => { const guide = guides.find(item => item.id === id) || guides[0]; document.querySelectorAll('[data-guide]').forEach(button => { const active = button.dataset.guide === guide.id; button.classList.toggle('active',active); button.setAttribute('aria-selected',active); }); panel.innerHTML = `<div class="tab-panel-head"><div><h3>${escapeHtml(guide.name)}</h3><p class="tab-tagline">${escapeHtml(guide.tagline)}</p></div><span class="tab-cadence">${escapeHtml(guide.cadence)}</span></div><p class="tab-brief">${escapeHtml(guide.brief)}</p><ul class="signal-list">${guide.signals.map(signal => `<li>${escapeHtml(signal)}</li>`).join('')}</ul><div class="guide-callout">${escapeHtml(guide.callout)}</div>`; };
        target.querySelectorAll('[data-guide]').forEach(button => button.addEventListener('click', () => openGuide(button.dataset.guide))); openGuide(guides[0].id);
      }
      function renderChecklist(items) {
        const target = document.getElementById('daily-checklist'); if (!target) return;
        let saved = {}; try { saved = JSON.parse(localStorage.getItem(gameDayKey()) || '{}'); } catch { saved = {}; }
        target.innerHTML = `<div class="checklist-layout"><div class="checklist">${items.map(item => `<label class="check-row"><input type="checkbox" data-check="${escapeHtml(item.id)}" ${saved[item.id] ? 'checked' : ''}><span class="check-copy"><strong>${escapeHtml(item.label)}</strong><span>${escapeHtml(item.hint)}</span></span><span class="check-status">${saved[item.id] ? 'done' : 'open'}</span></label>`).join('')}</div><aside class="check-summary"><span class="eyebrow">Today’s readiness</span><div class="summary-number"><span id="checked-count">0</span><small> / ${items.length}</small></div><p class="summary-copy">Checklist state resets automatically at the next game-day cycle, 17:00 UTC.</p><div class="progress-line"><span id="check-progress"></span></div></aside></div>`;
        const refresh = () => { const checks = [...target.querySelectorAll('[data-check]')]; const done = checks.filter(check => check.checked).length; const count = document.getElementById('checked-count'); const progress = document.getElementById('check-progress'); if (count) count.textContent = done; if (progress) progress.style.width = `${items.length ? (done / items.length) * 100 : 0}%`; };
        target.querySelectorAll('[data-check]').forEach(check => check.addEventListener('change', () => { saved[check.dataset.check] = check.checked; localStorage.setItem(gameDayKey(), JSON.stringify(saved)); refresh(); })); refresh();
      }
      function renderTroops(families) {
        const target = document.getElementById('troop-library'); if (!target) return;
        target.innerHTML = `<div class="troop-library">${families.map((family,index) => `<details class="troop-family" ${index === 0 ? 'open' : ''}><summary><span class="troop-mark">${escapeHtml(family.mark)}</span><span><strong>${escapeHtml(family.name)}</strong><span class="troop-note">${escapeHtml(family.note)}</span></span></summary><div class="tier-grid">${family.tiers.map(tier => `<details class="tier-expander"><summary><span>${escapeHtml(tier.label)}</span><span>${escapeHtml(tier.code)}</span></summary><div class="tier-content"><span class="tier-code">${escapeHtml(tier.code)}</span><br>${escapeHtml(tier.example)}<br><button class="copy-button" type="button" data-copy="${escapeHtml(tier.code)}">Copy level code</button></div></details>`).join('')}</div></details>`).join('')}</div>`;
      }
      function startCalendar() {
        const element = document.getElementById('event-calendar'); if (!element || !window.FullCalendar) return;
        if (appState.calendar) appState.calendar.destroy();
        appState.calendar = new FullCalendar.Calendar(element, { initialView:'dayGridMonth', firstDay:1, height:'auto', fixedWeekCount:false, dayMaxEvents:3, headerToolbar:{ left:'prev,next today', center:'title', right:'' }, buttonText:{ today:'now' }, eventSources:[{ url:'/data/tb-events.ics', format:'ics' }], eventClassNames: arg => { const title = arg.event.title.toLowerCase(); if (title.includes('ragnar')) return ['ragnarok']; if (title.includes('dark omens')) return ['dark-omens']; if (title.includes('tinman')) return ['tinman']; return []; } });
        appState.calendar.render();
      }
      async function initMoon() { const [guides, checklist, troops] = await Promise.all([fetchJson('/data/event-guides.json',fallbackGuides),fetchJson('/data/daily-checklist.json',fallbackChecklist),fetchJson('/data/troop-examples.json',fallbackTroops)]); renderGuides(guides); renderChecklist(checklist); renderTroops(troops); startCalendar(); }
      async function loadTheme(mode) {
        appState.mode = mode; const target = document.getElementById('site-body'); target.innerHTML = '<div class="empty-state">Opening the command ledger…</div>';
        try { const response = await fetch(`/${mode}.html`); if (!response.ok) throw new Error('view unavailable'); const html = await response.text(); const source = new DOMParser().parseFromString(html,'text/html'); target.innerHTML = source.body.innerHTML; document.title = source.title || 'Moonwatch — Clan Command'; document.body.dataset.mode = mode; const meta = themeMeta[mode] || themeMeta.moon; document.title = meta.title; const brandMark = document.getElementById('brand-mark'); const brandName = document.getElementById('brand-name'); if (brandMark) { brandMark.textContent = meta.mark; brandMark.className = 'brand-mark' + (mode === 'royal' ? ' royal-mark' : ''); } if (brandName) { brandName.textContent = meta.name; brandName.className = 'brand-name' + (mode === 'royal' ? ' royal-word' : ''); } document.querySelector('.brand-kicker')?.classList.toggle('royal-kicker', mode === 'royal'); document.querySelector('.hero')?.classList.toggle('royal-hero', mode === 'royal'); document.querySelectorAll('.section-card').forEach(card => card.classList.toggle('royal-card', mode === 'royal')); document.querySelector('.section-nav')?.classList.toggle('royal-nav', mode === 'royal'); document.querySelector('.theme-picker')?.classList.toggle('royal-theme', mode === 'royal'); if (mode === 'moon' || mode === 'sun' || mode === 'royal') await initMoon(); } catch { target.innerHTML = '<div class="empty-state">The requested command view could not be opened.</div>'; }
        updateThemeControl();
      }
      function updateThemeControl() { const select = document.querySelector('[data-theme-select]'); if (select) select.value = appState.mode; }
      document.addEventListener('change', event => { const select = event.target.closest('[data-theme-select]'); if (select) loadTheme(select.value); });
      document.addEventListener('click', event => { const select = event.target.closest('[data-theme-select]'); const loader = event.target.closest('[data-load-theme]'); const copy = event.target.closest('[data-copy]'); if (loader) { event.preventDefault(); loadTheme(loader.dataset.loadTheme); } if (copy && navigator.clipboard) { navigator.clipboard.writeText(copy.dataset.copy).then(() => { const original = copy.textContent; copy.textContent = 'Copied'; setTimeout(() => copy.textContent = original, 1100); }); } });
      updateClock(); setInterval(updateClock,1000); hydrateActiveEvent();
      const requestedMode = new URLSearchParams(location.search).get('view'); const initialMode = ['moon','sun','royal'].includes(requestedMode) ? requestedMode : 'moon'; loadTheme(initialMode);
    </script>
  </body>
</html>
